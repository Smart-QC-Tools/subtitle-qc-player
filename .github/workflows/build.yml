name: Build Mac app

# One build per version: a push to release/x.y.z rebuilds that stable release in place, a push to video-analysis
# rebuilds the preview. main itself builds nothing (its fixes reach the stable version through release/x.y.z).
on:
  push:
    branches: [video-analysis, 'release/**']
    paths-ignore: ['docs/**', 'README.md', 'IDEAS.md', 'CLAUDE.md', 'mac/selftest/**', '.github/workflows/selftest.yml', 'web/labs/*.src.html', 'web/labs/build_lab.py', 'web/labs/README.md', 'web/labs/fetch_assets.sh', '.github/workflows/labs.yml']   # (text-engine.js, lab-video.js and prores/ are in the app's web page too)
  workflow_dispatch:
    inputs:
      replace_release:
        description: (no longer needed - a push to release/x.y.z always rebuilds vx.y.z in place)
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write       # build attestation: signs with GitHub's identity for this workflow
  attestations: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build Subtitle QC Player.app
        run: BUILD_NUMBER=${{ github.run_number }} bash mac/build.sh

      # The web version's Video Analysis finds on-screen text with the lab's engine and a text-detection model
      # (about 35 MB, packed into the page). The Mac app's page doesn't carry it (its analysis is native), so the web
      # page is built again, with the model, after the app.
      - name: Web version with the text detector
        run: |
          bash web/labs/fetch_assets.sh
          cd web && TEXT_MODEL=1 python3 build.py

      # A signed record that these exact files were built by this workflow, in this repository, from this commit.
      # Anyone can check a download:  gh attestation verify Subtitle-QC-Player.zip --repo Smart-QC-Tools/subtitle-qc-player
      - name: Build attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            build/Subtitle-QC-Player.zip
            web/dist/Subtitle_QC_Player.html

      - name: Keep the build (Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: Subtitle-QC-Player-build-${{ github.run_number }}
          path: |
            build/Subtitle-QC-Player.zip
            web/dist/Subtitle_QC_Player.html

      # A release/x.y.z branch is that version's permanent release (tag vx.y.z): each push rebuilds it in place, so
      # the download links never change. (The old rolling "latest" release is removed.)
      - name: Publish the stable release for a release branch
        if: startsWith(github.ref, 'refs/heads/release/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME#release/}"
          NOTES="Stable version $VER (commit ${GITHUB_SHA::7}). Mac app: Subtitle-QC-Player.zip. Web version for Chrome: Subtitle_QC_Player.html."
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          if gh release view "v$VER" >/dev/null 2>&1; then
            git tag -f "v$VER" "$GITHUB_SHA" && git push -f origin "refs/tags/v$VER"
            gh release upload "v$VER" build/Subtitle-QC-Player.zip web/dist/Subtitle_QC_Player.html --clobber
            gh release edit "v$VER" --notes "$NOTES"
            echo "::notice::v$VER rebuilt from ${GITHUB_SHA::7}"
            exit 0
          fi
          gh release create "v$VER" build/Subtitle-QC-Player.zip web/dist/Subtitle_QC_Player.html \
            --target "$GITHUB_SHA" --latest=false \
            --title "Subtitle QC Player $VER (stable)" \
            --notes "$NOTES"

      # Work in progress on the video-analysis branch: a test build that never touches the download page.
      - name: Publish the video-analysis test build (pre-release)
        if: github.ref == 'refs/heads/video-analysis'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete analysis-preview --yes --cleanup-tag || true
          gh release create analysis-preview build/Subtitle-QC-Player.zip web/dist/Subtitle_QC_Player.html \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Video analysis $(sed -nE "s/^const APP_VERSION = '([^']+)';.*/\1/p" web/src/config.js) — test build ${{ github.run_number }}" \
            --notes "Work in progress, for testing only (commit ${GITHUB_SHA::7}). The stable version is on the download page."
