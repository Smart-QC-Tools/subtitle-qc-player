name: Build Mac app

on:
  push:
    branches: [main, video-analysis]
    tags: ['v*']
    paths-ignore: ['docs/**', 'README.md', 'IDEAS.md', 'mac/selftest/**', '.github/workflows/selftest.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build Subtitle QC Player.app
        run: BUILD_NUMBER=${{ github.run_number }} bash mac/build.sh

      - name: Keep the build (Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: Subtitle-QC-Player-build-${{ github.run_number }}
          path: |
            build/Subtitle-QC-Player.zip
            web/dist/Subtitle_QC_Player.html

      - name: Publish as the latest download (Releases)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/Subtitle-QC-Player.zip web/dist/Subtitle_QC_Player.html \
            --target "$GITHUB_SHA" \
            --title "Subtitle QC Player $(sed -nE "s/^const APP_VERSION = '([^']+)';.*/\1/p" web/src/config.js) — build ${{ github.run_number }}" \
            --notes "Latest build ($(date -u '+%Y-%m-%d %H:%M UTC'), commit ${GITHUB_SHA::7}). Mac app: Subtitle-QC-Player.zip. Web version for Chrome: Subtitle_QC_Player.html."

      # A version tag (v1.0.0 …) keeps that version as its own permanent release, which later builds never
      # replace. It is not marked as the latest, so the download page keeps following main.
      - name: Publish a permanent release for a version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/Subtitle-QC-Player.zip web/dist/Subtitle_QC_Player.html \
            --target "$GITHUB_SHA" --latest=false \
            --title "Subtitle QC Player ${GITHUB_REF_NAME#v} (stable)" \
            --notes "Stable version ${GITHUB_REF_NAME#v} (commit ${GITHUB_SHA::7}). Mac app: Subtitle-QC-Player.zip. Web version for Chrome: Subtitle_QC_Player.html."

      # Work in progress on the video-analysis branch: a test build that never touches the download page.
      - name: Publish the video-analysis test build (pre-release)
        if: github.ref == 'refs/heads/video-analysis'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete analysis-preview --yes --cleanup-tag || true
          gh release create analysis-preview build/Subtitle-QC-Player.zip web/dist/Subtitle_QC_Player.html \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Video analysis — test build ${{ github.run_number }}" \
            --notes "Work in progress, for testing only (commit ${GITHUB_SHA::7}). The stable version is on the download page."
